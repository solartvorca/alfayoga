<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Лунный Будильник</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            width: 100%;
            max-width: 400px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(180, 100, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
            color: #a18cd1;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            background: rgba(180, 100, 255, 0.1);
            border: 1px solid rgba(180, 100, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            color: #e0e6ed;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(180, 100, 255, 0.7);
            box-shadow: 0 0 10px rgba(180, 100, 255, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, #a18cd1 0%, #ffd700 100%);
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #0a0e27;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-google {
            width: 100%;
            background: rgba(66, 133, 244, 0.2);
            border: 1px solid rgba(66, 133, 244, 0.5);
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #e0e6ed;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-google:hover {
            background: rgba(66, 133, 244, 0.3);
            border-color: rgba(66, 133, 244, 0.8);
            transform: translateY(-2px);
        }

        .toggle-form {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 15px;
        }

        .toggle-form a {
            color: #a18cd1;
            cursor: pointer;
            text-decoration: underline;
        }

        .error {
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.5);
            color: #ff6464;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 640px) {
            .auth-container {
                max-width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Ссылка на страницу приветствия -->
    <div style="position: absolute; top: 20px; left: 20px;">
        <a href="welcome.html" style="color: #a18cd1; text-decoration: none; font-size: 14px; background: rgba(180, 100, 255, 0.1); padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(180, 100, 255, 0.2); transition: all 0.2s;" onmouseover="this.style.background='rgba(180, 100, 255, 0.2)'" onmouseout="this.style.background='rgba(180, 100, 255, 0.1)'">← О программе</a>
    </div>

    <div class="auth-container">
        <div class="auth-header">⭕ Осознавание</div>

        <div class="error" id="authError"></div>

        <!-- Вход -->
        <div id="loginForm">
            <form class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>
            <div style="margin-top: 20px; text-align: center;">
                <p style="color: #888; font-size: 13px; margin-bottom: 15px;">или</p>
                <button type="button" class="btn-google" onclick="handleGoogleSignIn()">
                    <span style="margin-right: 8px;">🔵</span> Войти через Google
                </button>
            </div>
            <div class="toggle-form">
                Нет аккаунта? <a onclick="showRegister()">Зарегистрироваться</a>
            </div>
        </div>

        <!-- Регистрация -->
        <div id="registerForm" style="display: none;">
            <form class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Ник</label>
                    <input type="text" id="registerNick" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>
            <div class="toggle-form">
                Уже есть аккаунт? <a onclick="showLogin()">Войти</a>
            </div>
        </div>

        <!-- Проверка email кода -->
        <div id="verifyEmailForm" style="display: none;">
            <form class="auth-form" onsubmit="handleVerifyEmail(event)">
                <p style="text-align: center; color: #a18cd1; margin-bottom: 20px;">
                    Мы отправили код подтверждения на<br>
                    <strong id="verifyEmailDisplay"></strong>
                </p>
                <div class="form-group">
                    <label>Код подтверждения (6 цифр)</label>
                    <input type="text" id="verificationCode" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus>
                </div>
                <button type="submit" class="btn">Подтвердить</button>
                <div style="text-align: center; margin-top: 15px;">
                    <small style="color: #888;">
                        Не пришел код?
                        <a onclick="resendVerificationCode()" style="color: #a18cd1; cursor: pointer; text-decoration: underline;">Отправить снова</a>
                    </small>
                </div>
                <div style="text-align: center; margin-top: 10px;">
                    <small style="color: #888;">
                        <a onclick="backToRegister()" style="color: #a18cd1; cursor: pointer; text-decoration: underline;">← Вернуться</a>
                    </small>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Сохранить реф-код ДО всех проверок авторизации
        const urlParams = new URLSearchParams(window.location.search);
        const refCode = urlParams.get('ref');
        if (refCode) {
            localStorage.setItem('pendingReferralCode', refCode);
            console.log('[Referral] Реф-код сохранен:', refCode);
        }

        const errorDiv = document.getElementById("authError");
        let registrationInProgress = false;

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.add("show");
            setTimeout(() => errorDiv.classList.remove("show"), 5000);
        }

        function showRegister() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
        }

        function showLogin() {
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = "marathon.html";
            } catch (error) {
                showError(error.message);
            }
        }

        async function handleGoogleSignIn() {
            try {
                console.log('[Google] Начинаю вход через Google');
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const uid = user.uid;

                console.log('[Google] ✓ Вход успешен, uid:', uid);

                // Проверяем есть ли уже профиль
                const userDoc = await db.collection("users").doc(uid).get();

                if (userDoc.exists) {
                    console.log('[Google] Профиль уже существует');
                    window.location.href = "marathon.html";
                } else {
                    console.log('[Google] Создаю новый профиль');

                    // Получаем реф-код если есть
                    const referrerCode = urlParams.get('ref') || localStorage.getItem('pendingReferralCode');
                    const referralCode = uid.substring(0, 8).toUpperCase();
                    let referrerId = null;

                    // Ищем реферера
                    if (referrerCode) {
                        try {
                            const referrerSnapshot = await db.collection("users")
                                .where("referralCode", "==", referrerCode.toUpperCase())
                                .limit(1)
                                .get();

                            if (!referrerSnapshot.empty) {
                                referrerId = referrerSnapshot.docs[0].id;
                                console.log('[Referral] ✓ Реферер найден');
                            }
                        } catch (error) {
                            console.error('[Referral] Ошибка поиска:', error);
                        }
                    }

                    // Создаем профиль
                    const userData = {
                        email: user.email,
                        nick: user.displayName || user.email.split('@')[0],
                        photoURL: user.photoURL || null,
                        rays: 0,
                        dustAmount: 0,
                        status: "active",
                        subscription: "free",
                        joinedAt: new Date(),
                        lastReportDay: 0,
                        isAdmin: user.email === "wuallar@gmail.com",
                        referralCode: referralCode,
                        referredBy: referrerId || null,
                        referralRays: 0,
                        totalReferrals: 0,
                        creativeProfile: {
                            bio: "",
                            services: "",
                            gifts: "",
                            links: [],
                            partnerLinks: [],
                            submittedAt: null,
                            raysEarned: 0
                        },
                        notificationSettings: {
                            practiceEnabled: true,
                            marathonEnabled: true,
                            commentsEnabled: true,
                            rayEnabled: true,
                            reportsEnabled: true,
                            reminderTime: "07:00",
                            frequency: "daily",
                            updatedAt: new Date()
                        }
                    };

                    await db.collection("users").doc(uid).set(userData);
                    console.log('[Google] ✓ Профиль создан');

                    // Даем награду реферету если есть
                    if (referrerId) {
                        try {
                            await db.collection("users").doc(referrerId).update({
                                rays: firebase.firestore.FieldValue.increment(100),
                                referralRays: firebase.firestore.FieldValue.increment(100),
                                totalReferrals: firebase.firestore.FieldValue.increment(1)
                            });
                            console.log('[Referral] ✓ 100 лучиков добавлено');
                        } catch (error) {
                            console.error('[Referral] Ошибка добавления лучиков:', error);
                        }
                    }

                    // Очищаем код
                    localStorage.removeItem('pendingReferralCode');

                    // Переходим на марафон
                    setTimeout(() => {
                        window.location.href = "marathon.html";
                    }, 500);
                }
            } catch (error) {
                console.error('[Google] Ошибка:', error);
                showError(error.message || 'Ошибка входа через Google. Попробуй позже.');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            registrationInProgress = true;
            const nick = document.getElementById("registerNick").value;
            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;

            try {
                console.log('[Registration] Создаю аккаунт для:', email);

                // Создаем аккаунт в Firebase
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCredential.user.uid;
                console.log('[Registration] ✓ Аккаунт создан, uid:', uid);

                // Получаем реф-код реферера если есть
                const referrerCode = urlParams.get('ref') || localStorage.getItem('pendingReferralCode');
                const referralCode = uid.substring(0, 8).toUpperCase();
                let referrerId = null;

                // Ищем реферера по коду
                if (referrerCode) {
                    console.log('[Referral] Ищу реферера с кодом:', referrerCode);
                    try {
                        const referrerSnapshot = await db.collection("users")
                            .where("referralCode", "==", referrerCode.toUpperCase())
                            .limit(1)
                            .get();

                        if (!referrerSnapshot.empty) {
                            referrerId = referrerSnapshot.docs[0].id;
                            console.log('[Referral] ✓ Реферер найден');
                        } else {
                            console.warn('[Referral] Код не найден');
                        }
                    } catch (error) {
                        console.error('[Referral] Ошибка поиска:', error);
                    }
                }

                // Создаем профиль пользователя в Firestore
                const userData = {
                    email,
                    nick,
                    rays: 0,
                    dustAmount: 0,
                    status: "active",
                    subscription: "free",
                    joinedAt: new Date(),
                    lastReportDay: 0,
                    isAdmin: email === "wuallar@gmail.com",
                    referralCode: referralCode,
                    referredBy: referrerId || null,
                    referralRays: 0,
                    totalReferrals: 0,
                    creativeProfile: {
                        bio: "",
                        services: "",
                        gifts: "",
                        links: [],
                        partnerLinks: [],
                        submittedAt: null,
                        raysEarned: 0
                    },
                    notificationSettings: {
                        practiceEnabled: true,
                        marathonEnabled: true,
                        commentsEnabled: true,
                        rayEnabled: true,
                        reportsEnabled: true,
                        reminderTime: "07:00",
                        frequency: "daily",
                        updatedAt: new Date()
                    }
                };

                await db.collection("users").doc(uid).set(userData);
                console.log('[Registration] ✓ Профиль создан');

                // Даем награду реферету
                if (referrerId) {
                    try {
                        console.log('[Referral] Добавляю 100 лучиков реферету');
                        await db.collection("users").doc(referrerId).update({
                            rays: firebase.firestore.FieldValue.increment(100),
                            referralRays: firebase.firestore.FieldValue.increment(100),
                            totalReferrals: firebase.firestore.FieldValue.increment(1)
                        });
                        console.log('[Referral] ✓ 100 лучиков добавлено');
                    } catch (error) {
                        console.error('[Referral] Ошибка добавления лучиков:', error);
                    }
                }

                // Очищаем код из localStorage
                localStorage.removeItem('pendingReferralCode');

                // Небольшая задержка перед редиректом
                setTimeout(() => {
                    registrationInProgress = false;
                    window.location.href = "marathon.html";
                }, 500);

            } catch (error) {
                console.error('[Registration] Ошибка:', error);
                showError(error.message || 'Ошибка регистрации. Попробуй позже.');
                registrationInProgress = false;
            }
        }

        // Проверить состояние авторизации
        auth.onAuthStateChanged(user => {
            if (user && !registrationInProgress) {
                window.location.href = "marathon.html";
            }
        });

        // Debug функция
        window.debugReferralCode = async (code) => {
            console.log(`Проверяю код: ${code}`);
            try {
                const snapshot = await db.collection("users")
                    .where("referralCode", "==", code.toUpperCase())
                    .limit(1)
                    .get();

                if (!snapshot.empty) {
                    const user = snapshot.docs[0].data();
                    console.log(`✓ Код найден!`, user);
                    return user;
                } else {
                    console.error(`✗ Код ${code} не найден`);
                    return null;
                }
            } catch (error) {
                console.error("Ошибка:", error);
                return null;
            }
        };
    </script>
    <script src="mobile-nav.js"></script>
</body>
</html>
