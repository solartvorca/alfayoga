<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Лунный Будильник</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            width: 100%;
            max-width: 400px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(180, 100, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
            color: #a18cd1;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            background: rgba(180, 100, 255, 0.1);
            border: 1px solid rgba(180, 100, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            color: #e0e6ed;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(180, 100, 255, 0.7);
            box-shadow: 0 0 10px rgba(180, 100, 255, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, #a18cd1 0%, #ffd700 100%);
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #0a0e27;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toggle-form {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 15px;
        }

        .toggle-form a {
            color: #a18cd1;
            cursor: pointer;
            text-decoration: underline;
        }

        .error {
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.5);
            color: #ff6464;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 640px) {
            .auth-container {
                max-width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Ссылка на страницу приветствия -->
    <div style="position: absolute; top: 20px; left: 20px;">
        <a href="welcome.html" style="color: #a18cd1; text-decoration: none; font-size: 14px; background: rgba(180, 100, 255, 0.1); padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(180, 100, 255, 0.2); transition: all 0.2s;" onmouseover="this.style.background='rgba(180, 100, 255, 0.2)'" onmouseout="this.style.background='rgba(180, 100, 255, 0.1)'">← О программе</a>
    </div>

    <div class="auth-container">
        <div class="auth-header">⭕ Осознавание</div>

        <div class="error" id="authError"></div>

        <!-- Вход -->
        <div id="loginForm">
            <form class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn">Войти</button>
            </form>
            <div class="toggle-form">
                Нет аккаунта? <a onclick="showRegister()">Зарегистрироваться</a>
            </div>
        </div>

        <!-- Регистрация -->
        <div id="registerForm" style="display: none;">
            <form class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Ник</label>
                    <input type="text" id="registerNick" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>
            <div class="toggle-form">
                Уже есть аккаунт? <a onclick="showLogin()">Войти</a>
            </div>
        </div>

        <!-- Проверка email кода -->
        <div id="verifyEmailForm" style="display: none;">
            <form class="auth-form" onsubmit="handleVerifyEmail(event)">
                <p style="text-align: center; color: #a18cd1; margin-bottom: 20px;">
                    Мы отправили код подтверждения на<br>
                    <strong id="verifyEmailDisplay"></strong>
                </p>
                <div class="form-group">
                    <label>Код подтверждения (6 цифр)</label>
                    <input type="text" id="verificationCode" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus>
                </div>
                <button type="submit" class="btn">Подтвердить</button>
                <div style="text-align: center; margin-top: 15px;">
                    <small style="color: #888;">
                        Не пришел код?
                        <a onclick="resendVerificationCode()" style="color: #a18cd1; cursor: pointer; text-decoration: underline;">Отправить снова</a>
                    </small>
                </div>
                <div style="text-align: center; margin-top: 10px;">
                    <small style="color: #888;">
                        <a onclick="backToRegister()" style="color: #a18cd1; cursor: pointer; text-decoration: underline;">← Вернуться</a>
                    </small>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // КРИТИЧНО: Сохранить реф-код ДО всех проверок авторизации
        const urlParams = new URLSearchParams(window.location.search);
        const refCode = urlParams.get('ref');
        if (refCode) {
            localStorage.setItem('pendingReferralCode', refCode);
            console.log('[Referral STORAGE] Код сохранен в localStorage:', refCode);
            confirm('✓ Реферальный код сохранен: ' + refCode + '\n\nНажми OK чтобы продолжить');
        } else {
            const stored = localStorage.getItem('pendingReferralCode');
            if (stored) {
                console.log('[Referral STORAGE] Код найден в localStorage:', stored);
                confirm('✓ Используем сохраненный код из localStorage: ' + stored + '\n\nНажми OK чтобы продолжить');
            }
        }

        const errorDiv = document.getElementById("authError");
        let registrationInProgress = false;

        // Данные регистрации во время процесса проверки email
        let pendingRegistrationData = {
            email: null,
            password: null,
            nick: null,
            referrerCode: null
        };

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.add("show");
            setTimeout(() => errorDiv.classList.remove("show"), 5000);
        }

        function showRegister() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
        }

        function showLogin() {
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = "marathon.html";
            } catch (error) {
                showError(error.message);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            registrationInProgress = true;
            const nick = document.getElementById("registerNick").value;
            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;

            try {
                console.log('[Registration] Отправляю ссылку для входа на:', email);

                // Сохраняем данные регистрации
                pendingRegistrationData = {
                    email,
                    password,
                    nick,
                    referrerCode: new URLSearchParams(window.location.search).get('ref') || localStorage.getItem('pendingReferralCode')
                };

                // Настройки для ссылки входа по email
                const actionCodeSettings = {
                    url: window.location.origin + window.location.pathname + '?register=1',
                    handleCodeInApp: true
                };

                // Отправляем ссылку для входа
                await auth.sendSignInLinkToEmail(email, actionCodeSettings);
                console.log('[Registration] ✓ Ссылка отправлена на email:', email);

                // Сохраняем email в localStorage для использования после перехода по ссылке
                localStorage.setItem('pendingRegistrationEmail', email);
                localStorage.setItem('pendingRegistrationData', JSON.stringify(pendingRegistrationData));

                // Показываем сообщение
                document.getElementById("registerForm").style.display = "none";
                showError('✓ Ссылка для входа отправлена на ' + email + '. Проверьте почту!');

                // Показываем кнопку для возврата
                const backBtn = document.createElement('button');
                backBtn.textContent = '← Вернуться';
                backBtn.style.marginTop = '10px';
                backBtn.style.width = '100%';
                backBtn.onclick = () => {
                    document.getElementById("registerForm").style.display = "block";
                    backBtn.remove();
                    showError('');
                };
                document.querySelector('.auth-container').appendChild(backBtn);

                registrationInProgress = false;
            } catch (error) {
                console.error('[Registration] Ошибка:', error);
                showError(error.message || 'Ошибка отправки ссылки. Попробуй позже.');
                registrationInProgress = false;
            }
        }

        // Обработка ссылки входа по email при загрузке страницы
        async function handleEmailLinkSignIn() {
            if (auth.isSignInWithEmailLink(window.location.href)) {
                console.log('[EmailLink] Обнаружена ссылка входа');

                let email = localStorage.getItem('pendingRegistrationEmail');
                let registrationDataStr = localStorage.getItem('pendingRegistrationData');

                if (!email) {
                    email = prompt('Введи свой email для подтверждения:');
                }

                if (!email) {
                    console.error('[EmailLink] Email не введен');
                    return;
                }

                try {
                    console.log('[EmailLink] Завершаю вход по ссылке...');
                    const result = await auth.signInWithEmailLink(email, window.location.href);
                    const uid = result.user.uid;

                    console.log('[EmailLink] ✓ Вход завершен, uid:', uid);

                    // Получаем данные регистрации
                    let registrationData = registrationDataStr ? JSON.parse(registrationDataStr) : null;

                    if (registrationData) {
                        console.log('[Registration] Создаю профиль пользователя...');
                        const referralCode = uid.substring(0, 8).toUpperCase();
                        let referrerId = null;
                        let referrerCode = registrationData.referrerCode;

                        console.log(`[Referral DEBUG] Итоговый код для поиска: "${referrerCode}"`);

                // Найти UID реферера по его коду
                if (referrerCode) {
                    console.log(`[Referral] Ищу реферера с кодом: ${referrerCode.toUpperCase()}`);
                    try {
                        console.log('[Referral] Запускаю запрос к Firestore...');
                        const referrerSnapshot = await db.collection("users")
                            .where("referralCode", "==", referrerCode.toUpperCase())
                            .limit(1)
                            .get();

                        console.log(`[Referral] Результат запроса: ${referrerSnapshot.size} документ(ов)`);
                        if (!referrerSnapshot.empty) {
                            referrerId = referrerSnapshot.docs[0].id;
                            const referrerData = referrerSnapshot.docs[0].data();
                            console.log(`[Referral] ✓ Реферер найден: ${referrerData.nick || referrerData.email}`);
                            console.log(`[Referral] UID: ${referrerId}`);
                            console.log(`[Referral] Текущие лучики реферера: ${referrerData.rays}`);
                        } else {
                            console.warn(`[Referral] ✗ Код ${referrerCode} не найден в базе`);
                        }
                    } catch (error) {
                        console.error("[Referral] Ошибка поиска реферера:", error);
                    }
                } else {
                    console.log("[Referral] Параметр ref не указан");
                }

                // Создать документ нового пользователя
                const userData = {
                    email,
                    nick,
                    rays: 0,
                    dustAmount: 0,
                    status: "active",
                    subscription: "free",
                    joinedAt: new Date(),
                    lastReportDay: 0,
                    isAdmin: email === "wuallar@gmail.com",
                    referralCode: referralCode,
                    referredBy: referrerId || null,
                    referralRays: 0,
                    totalReferrals: 0,
                    creativeProfile: {
                        bio: "",
                        services: "",
                        gifts: "",
                        links: [],
                        partnerLinks: [],
                        submittedAt: null,
                        raysEarned: 0
                    },
                    notificationSettings: {
                        practiceEnabled: true,
                        marathonEnabled: true,
                        commentsEnabled: true,
                        rayEnabled: true,
                        reportsEnabled: true,
                        reminderTime: "07:00",
                        frequency: "daily",
                        updatedAt: new Date()
                    }
                };

                console.log('[Registration] Сохраняю данные нового пользователя в Firestore...');
                await db.collection("users").doc(uid).set(userData);
                console.log('[Registration] ✓ Данные пользователя сохранены');

                // Дать награду реферету за новую регистрацию
                if (referrerId) {
                    try {
                        console.log(`[Referral] Добавляю 100 лучиков реферету ${referrerId}...`);
                        await db.collection("users").doc(referrerId).update({
                            rays: firebase.firestore.FieldValue.increment(100),
                            referralRays: firebase.firestore.FieldValue.increment(100),
                            totalReferrals: firebase.firestore.FieldValue.increment(1)
                        });
                        console.log(`[Referral] ✓ Успешно добавлено 100 лучиков реферету ${referrerId}`);
                    } catch (error) {
                        console.error("[Referral] ✗ Ошибка при добавлении лучиков:", error);
                    }
                } else if (referrerCode) {
                    console.warn(`[Referral] ✗ Реферер с кодом ${referrerCode} не найден, лучики не добавлены`);
                }

                // Очистить код из localStorage после успешной регистрации
                localStorage.removeItem('pendingReferralCode');
                console.log('[Referral] Код удален из localStorage');
                console.log('[Registration] ✓ Регистрация завершена успешно, перенаправляю на marathon.html');

                // Небольшая задержка чтобы убедиться что все Firestore операции завершились
                setTimeout(() => {
                    registrationInProgress = false;
                    window.location.href = "marathon.html";
                        }, 500);
                    }
                } catch (error) {
                    console.error('[EmailLink] Ошибка:', error);
                    showError(error.message || 'Ошибка при входе по ссылке. Попробуй позже.');
                }
            }
        }

        // Вызываем обработку ссылки входа при загрузке страницы
        handleEmailLinkSignIn();
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (!response.ok) {
                    throw new Error('Ошибка отправки кода');
                }

                showError('✓ Новый код отправлен на ' + email);
                document.getElementById("verificationCode").value = '';
                document.getElementById("verificationCode").focus();
            } catch (error) {
                console.error('[Resend] Ошибка:', error);
                showError(error.message || 'Ошибка при отправке кода');
            }
        }

        // Вернуться на форму регистрации
        function backToRegister() {
            document.getElementById("verifyEmailForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
            document.getElementById("verificationCode").value = '';
            pendingRegistrationData = { email: null, password: null, nick: null, referrerCode: null };
        }

        // Проверить состояние (но не перенаправлять во время регистрации)
        auth.onAuthStateChanged(user => {
            if (user && !registrationInProgress) {
                window.location.href = "marathon.html";
            }
        });

        // Debug функция для проверки реферальных кодов (вызывать из консоли)
        window.debugReferralCode = async (code) => {
            console.log(`Проверяю реферальный код: ${code}`);
            try {
                const snapshot = await db.collection("users")
                    .where("referralCode", "==", code.toUpperCase())
                    .limit(1)
                    .get();

                if (!snapshot.empty) {
                    const user = snapshot.docs[0].data();
                    console.log(`✓ Код найден! Пользователь:`, user);
                    console.log(`  Email: ${user.email}`);
                    console.log(`  Ник: ${user.nick}`);
                    console.log(`  Текущие лучики: ${user.rays}`);
                    console.log(`  Лучики от рефералов: ${user.referralRays}`);
                    console.log(`  Количество приведенных: ${user.totalReferrals}`);
                    return user;
                } else {
                    console.error(`✗ Код ${code} не найден в базе`);
                    return null;
                }
            } catch (error) {
                console.error("Ошибка при проверке кода:", error);
                return null;
            }
        };
    </script>
    <script src="mobile-nav.js"></script>
</body>
</html>
