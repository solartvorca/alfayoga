<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0e27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Радуга Луна">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Профиль участника — Лунный Будильник</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-btn {
            display: inline-block;
            color: #a18cd1;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .back-btn:hover {
            color: #ffd700;
        }

        .profile-card {
            background: rgba(180, 100, 255, 0.08);
            border: 1px solid rgba(180, 100, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-nick {
            font-size: 24px;
            font-weight: 600;
            color: #a18cd1;
            margin-bottom: 10px;
        }

        .profile-email {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .rays-display {
            font-size: 48px;
            margin: 20px 0;
        }

        .rays-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .section {
            background: rgba(180, 100, 255, 0.08);
            border: 1px solid rgba(180, 100, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #a18cd1;
            margin-bottom: 15px;
        }

        .section-text {
            font-size: 14px;
            color: #c8d0db;
            line-height: 1.8;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            display: inline-block;
            background: rgba(0, 143, 204, 0.2);
            border: 1px solid rgba(0, 143, 204, 0.5);
            color: #00a3e0;
            padding: 8px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
        }

        .link-item:hover {
            background: rgba(0, 143, 204, 0.3);
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(180, 100, 255, 0.2);
            overflow-x: auto;
            padding-bottom: 0;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: #a18cd1;
        }

        .tab-btn.active {
            color: #a18cd1;
            border-bottom-color: #ffd700;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 640px) {
            .profile-container {
                max-width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <a class="back-btn" onclick="history.back()">← Назад</a>

        <div class="profile-card">
            <div class="profile-nick" id="profileNick">Загрузка...</div>
            <div class="profile-email" id="profileEmail"></div>
            <div style="display: flex; justify-content: space-around; margin: 20px 0;">
                <div style="text-align: center;">
                    <div class="rays-display">🔥 <span id="raysCount">0</span></div>
                    <div class="rays-label">ЛУЧИКОВ</div>
                </div>
                <div style="text-align: center;">
                    <div class="rays-display">✨ <span id="dustCount">0</span></div>
                    <div class="rays-label">ЗОЛОТОЙ ПЫЛЬЦЫ</div>
                </div>
                <div style="text-align: center;">
                    <div class="rays-display">🌿 <span id="pranaCount">0</span></div>
                    <div class="rays-label">ПРАНЫ</div>
                </div>
            </div>
        </div>

        <!-- ЮПИК -->
        <div id="yupikCard" style="display:none;text-align:center;padding:22px 16px;background:rgba(161,140,209,0.06);border:1px solid rgba(161,140,209,0.2);border-radius:16px;margin-bottom:18px;">
            <div style="font-size:12px;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">Юпик участника</div>
            <div style="font-size:16px;font-weight:700;color:#a18cd1;margin-bottom:4px;" id="yupikStageName">—</div>
            <div style="font-size:12px;color:#666;margin-bottom:14px;" id="yupikProgress">—</div>
            <div style="position:relative;display:inline-block;">
                <div id="yupikEmoji" style="font-size:72px;line-height:1;margin-bottom:4px;">🥚</div>
                <img id="yupikImg" alt="Юпик"
                    style="width:200px;height:200px;object-fit:contain;border-radius:14px;display:none;border:1px solid rgba(161,140,209,0.2);">
            </div>
        </div>

        <!-- Навигация вкладок -->
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('about')">👤 Об авторе</button>
            <button class="tab-btn" onclick="switchTab('services')">🛍️ Услуги и товары</button>
            <button class="tab-btn" onclick="switchTab('dreams')">🌙 Сновидения</button>
        </div>

        <!-- Вкладка "Об авторе" -->
        <div id="about-tab" class="tab-content active">
            <div id="profileAboutSection"></div>
        </div>

        <!-- Вкладка "Услуги и товары" -->
        <div id="services-tab" class="tab-content">
            <div id="profileServicesSection"></div>
        </div>

        <!-- Вкладка "Сновидения" -->
        <div id="dreams-tab" class="tab-content">
            <div id="profileDreamsSection"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        async function loadPublicHabits(uid) {
            try {
                const habitsDoc = await db.collection("habits").doc(uid).get();
                if (!habitsDoc.exists) return;

                const habits = (habitsDoc.data().habits || []).filter(h => h.isPublic);

                if (habits.length === 0) return;

                let habitsHTML = `
                    <div class="section">
                        <div class="section-title">📋 Публичные привычки</div>
                `;

                habits.forEach(habit => {
                    habitsHTML += `
                        <div style="margin-bottom: 10px; padding: 10px; background: rgba(180, 100, 255, 0.05); border-radius: 6px; border-left: 3px solid rgba(180, 100, 255, 0.3);">
                            <div style="font-size: 13px; color: #c8d0db;">${habit.text}</div>
                        </div>
                    `;
                });

                habitsHTML += '</div>';

                const profileSection = document.getElementById("profileAboutSection");
                profileSection.innerHTML += habitsHTML;
            } catch (error) {
                console.error("Ошибка при загрузке публичных привычек:", error);
            }
        }

        async function loadPublicUserWishes(uid) {
            try {
                const snapshot = await db.collection("public_wishes")
                    .where("uid", "==", uid)
                    .get();

                if (snapshot.empty) {
                    return; // No public wishes
                }

                // Сортировка на клиенте (по дате)
                const wishes = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                wishes.sort((a, b) => b.createdAt.seconds - a.createdAt.seconds);

                let wishesHTML = `
                    <div class="section">
                        <div class="section-title">✨ Публичные желания</div>
                `;

                wishes.forEach(wish => {
                    wishesHTML += `
                        <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(180, 100, 255, 0.1);">
                            <div style="font-size: 14px; color: #c8d0db; line-height: 1.6; margin-bottom: 8px;">${wish.text}</div>
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <span style="font-size: 12px; color: #ffd700; font-weight: 600;">💛 ${wish.votes} ✨</span>
                                <span style="font-size: 11px; color: #888;">${new Date(wish.createdAt.seconds * 1000).toLocaleDateString("ru-RU")}</span>
                            </div>
                        </div>
                    `;
                });

                wishesHTML += '</div>';

                // Append wishes to profileAboutSection
                const profileSection = document.getElementById("profileAboutSection");
                profileSection.innerHTML += wishesHTML;
            } catch (error) {
                console.error("Ошибка при загрузке публичных желаний:", error);
            }
        }

        async function loadPublicProfile() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get("uid");

            if (!uid) {
                document.querySelector(".profile-container").innerHTML = '<p style="text-align: center; color: #888;">Профиль не найден</p>';
                return;
            }

            try {
                const userDoc = await db.collection("users").doc(uid).get();
                if (!userDoc.exists) {
                    document.querySelector(".profile-container").innerHTML = '<p style="text-align: center; color: #888;">Пользователь не найден</p>';
                    return;
                }

                const user = { uid, ...userDoc.data() };
                document.getElementById("profileNick").textContent = user.nick || "Участник";
                document.getElementById("profileEmail").textContent = user.email || "";
                document.getElementById("raysCount").textContent = Math.round(user.rays || 0);
                document.getElementById("dustCount").textContent = Math.round(user.dust || 0);
                document.getElementById("pranaCount").textContent = Math.round(user.prana || 0);
                renderViewYupik(user);

                const profile = user.creativeProfile || {};

                // Заполнить вкладку "Об авторе"
                let aboutHTML = '';
                if (profile.bio) {
                    aboutHTML += `
                        <div class="section">
                            <div class="section-title">✨ О себе</div>
                            <div class="section-text">${profile.bio}</div>
                        </div>
                    `;
                }

                if (profile.links && profile.links.length > 0) {
                    aboutHTML += `
                        <div class="section">
                            <div class="section-title">🔗 Ссылки</div>
                            <div class="links-list">
                                ${profile.links.map(link => `<a href="${link}" target="_blank" class="link-item">${link}</a>`).join('')}
                            </div>
                        </div>
                    `;
                }

                // Послание о предназначении
                if (user.destinyReading && user.destinyReading.text) {
                    const dr = user.destinyReading;
                    let dateStr = '';
                    if (dr.generatedAt) {
                        const d = dr.generatedAt.toDate ? dr.generatedAt.toDate() : new Date(dr.generatedAt);
                        dateStr = `<div style="font-size:12px;color:#666;margin-top:10px;">Получено ${d.toLocaleDateString("ru-RU", { day:"numeric", month:"long", year:"numeric" })}</div>`;
                    }
                    aboutHTML = `
                        <div class="section" style="border-left: 3px solid #a18cd1; background: rgba(161,140,209,0.06);">
                            <div class="section-title" style="color:#a18cd1;">✨ Послание о предназначении</div>
                            <div class="section-text" style="line-height:1.8;">${dr.text}</div>
                            ${dateStr}
                        </div>
                    ` + aboutHTML;
                }

                // Базовый расчёт HD
                if (user.hdBasicReading && user.hdBasicReading.text && !user.hdBasicReading.isPrivate) {
                    const r = user.hdBasicReading;
                    const d = r.generatedAt ? (r.generatedAt.toDate ? r.generatedAt.toDate() : new Date(r.generatedAt)) : null;
                    aboutHTML += `
                        <div class="section" style="border-left:3px solid #00d084; background:rgba(0,208,132,0.04);">
                            <div class="section-title" style="color:#00d084;">🌿 Базовый расчёт по Человеческому Дизайну</div>
                            <div class="section-text" style="line-height:1.8;">${r.text}</div>
                            ${d ? `<div style="font-size:12px;color:#666;margin-top:10px;">Получено ${d.toLocaleDateString("ru-RU", {day:"numeric",month:"long",year:"numeric"})}</div>` : ''}
                        </div>
                    `;
                }

                // Расчёт по базе HD
                if (user.hdKBReading && user.hdKBReading.text && !user.hdKBReading.isPrivate) {
                    const r = user.hdKBReading;
                    const d = r.generatedAt ? (r.generatedAt.toDate ? r.generatedAt.toDate() : new Date(r.generatedAt)) : null;
                    aboutHTML += `
                        <div class="section" style="border-left:3px solid #a18cd1; background:rgba(161,140,209,0.05);">
                            <div class="section-title" style="color:#a18cd1;">🔮 Расчёт по базе знаний HD</div>
                            <div class="section-text" style="line-height:1.8;">${r.text}</div>
                            ${d ? `<div style="font-size:12px;color:#666;margin-top:10px;">Получено ${d.toLocaleDateString("ru-RU", {day:"numeric",month:"long",year:"numeric"})}</div>` : ''}
                        </div>
                    `;
                }

                document.getElementById("profileAboutSection").innerHTML = aboutHTML || '<div class="empty-state">Информация не заполнена</div>';

                // Заполнить вкладку "Услуги и товары"
                if (profile.services || profile.gifts || profile.partnerLinks) {
                    let servicesHtml = '';
                    if (profile.services) {
                        servicesHtml += `
                            <div class="section">
                                <div class="section-title">🛍️ Услуги и товары</div>
                                <div class="section-text">${profile.services}</div>
                            </div>
                        `;
                    }
                    if (profile.gifts) {
                        servicesHtml += `
                            <div class="section">
                                <div class="section-title">🎁 Дары и подарки</div>
                                <div class="section-text">${profile.gifts}</div>
                            </div>
                        `;
                    }
                    if (profile.partnerLinks && profile.partnerLinks.length > 0) {
                        servicesHtml += `
                            <div class="section">
                                <div class="section-title">🤝 Партнёрские программы</div>
                                <div style="display: flex; flex-direction: column; gap: 10px;">
                                    ${profile.partnerLinks.map(link => `
                                        <a href="${link}" target="_blank" style="color: #a18cd1; text-decoration: none; word-break: break-all; padding: 10px; background: rgba(180, 100, 255, 0.1); border-radius: 6px; border: 1px solid rgba(180, 100, 255, 0.2); transition: all 0.2s;" onmouseover="this.style.background='rgba(180, 100, 255, 0.2)'" onmouseout="this.style.background='rgba(180, 100, 255, 0.1)'">🔗 ${link}</a>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                    document.getElementById("profileServicesSection").innerHTML = servicesHtml;
                } else {
                    document.getElementById("profileServicesSection").innerHTML = '<div class="empty-state">Услуги, подарки и партнёрские программы не указаны</div>';
                }

                // Загрузить публичные желания, сны и привычки
                loadPublicHabits(uid);
                loadPublicDreams(uid);
                loadPublicUserWishes(uid);
            } catch (error) {
                console.error("Ошибка:", error);
                document.querySelector(".profile-container").innerHTML = '<p style="text-align: center; color: #888;">Ошибка загрузки профиля</p>';
            }
        }

        async function loadPublicDreams(uid) {
            try {
                const snapshot = await db.collection("dreams")
                    .where("uid", "==", uid)
                    .where("isPublic", "==", true)
                    .get();

                const dreams = [];
                snapshot.docs.forEach(doc => {
                    dreams.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                // Sort by createdAt descending (newest first)
                dreams.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                if (dreams.length === 0) {
                    document.getElementById("profileDreamsSection").innerHTML = '<div class="empty-state">Сновидений не опубликовано</div>';
                    return;
                }

                let dreamsHTML = `
                    <div class="section">
                        <div class="section-title">🌙 Публичные сны</div>
                `;

                dreams.forEach(dream => {
                    const date = new Date(dream.createdAt?.seconds * 1000 || 0);
                    const dateStr = date.toLocaleDateString("ru-RU", {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    dreamsHTML += `
                        <div class="dream-item" style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(180, 100, 255, 0.1);">
                            <div style="font-size: 12px; color: #888; margin-bottom: 8px;">${dateStr}</div>
                            <div style="font-size: 14px; color: #c8d0db; line-height: 1.8;">${dream.text}</div>
                        </div>
                    `;
                });

                dreamsHTML += '</div>';

                // Append dreams to profileDreamsSection
                const profileSection = document.getElementById("profileDreamsSection");
                profileSection.innerHTML = dreamsHTML;
            } catch (error) {
                console.error("Ошибка при загрузке публичных снов:", error);
            }
        }

        loadPublicProfile();

        // ===== ЮПИК (просмотр чужого профиля) =====
        const YUPIK_STAGES_VIEW = [
            { threshold: 200, name: '🐉 Юпик', emoji: '🐉',
              prompt: 'cute fluffy teal turquoise baby dragon, full body standing upright, chibi Pixar style, 3D render, white background, big round black eyes, small brown horns, bat wings teal, golden crown with teal gems, teal cape with sacred geometry patterns, holding crystal icosahedron die, sacred geometry metatrons cube golden lines background, flower of life, fluffy fur texture, adorable, high quality render' },
            { threshold: 100, name: '🐣 Юпик вылупляется', emoji: '🐣',
              prompt: 'cute fluffy teal turquoise baby dragon hatching, emerging from cracked teal egg, head and upper body visible, piece of eggshell on head, big round black eyes, tiny brown horns, fluffy fur, sacred geometry golden lines background, metatrons cube, chibi Pixar 3D render, white background, adorable, high quality' },
            { threshold: 75,  name: '🥚 Яйцо с отверстиями', emoji: '🥚',
              prompt: 'teal turquoise magical egg with cracks and holes, bright golden light shining through multiple cracks, sacred geometry patterns etched on egg surface, flower of life engraving, teal glow from inside, white background, 3D render, fantasy art, high quality' },
            { threshold: 50,  name: '🥚 Трескающееся яйцо', emoji: '🥚',
              prompt: 'teal turquoise magical egg with thin cracks appearing, soft golden inner glow through hairline cracks, sacred geometry metatrons cube pattern on egg surface, white background, 3D render, fantasy art, high quality' },
            { threshold: 10,  name: '🥚 Яйцо', emoji: '🥚',
              prompt: 'perfect smooth teal turquoise magical egg, glowing golden light emanating softly, sacred geometry flower of life faintly visible on surface, white background, 3D render, fantasy art, high quality' },
        ];

        function uidToSeedView(uid) {
            let h = 0;
            for (let i = 0; i < uid.length; i++) { h = Math.imul(31, h) + uid.charCodeAt(i) | 0; }
            return Math.abs(h);
        }

        const ELEM_VISUALS_VIEW = {
            fire: 'fiery orange-red ember glow', water: 'aqua blue shimmering water droplets',
            earth: 'emerald green mossy crystal gems', air: 'silvery white wind wisps',
            lightning: 'electric blue lightning bolts', moon: 'silver moonlight crescent glow'
        };

        function buildViewPrompt(stage, totem) {
            if (!totem || !totem.animal) return stage.prompt;
            const ev = ELEM_VISUALS_VIEW[totem.element] || '';
            return `${stage.prompt}, embodying the spirit of ${totem.animal}${totem.qualities ? ', ' + totem.qualities : ''}${ev ? ', ' + ev : ''}`;
        }

        function renderViewYupik(user) {
            const rays = user.rays || 0;
            const stage = YUPIK_STAGES_VIEW.find(s => rays >= s.threshold);
            const card  = document.getElementById('yupikCard');
            if (!card) return;
            if (!stage) { card.style.display = 'none'; return; }

            card.style.display = 'block';
            document.getElementById('yupikStageName').textContent = stage.name;
            const next = [...YUPIK_STAGES_VIEW].reverse().find(s => s.threshold > rays);
            document.getElementById('yupikProgress').textContent = next
                ? `До следующего этапа: ещё ${next.threshold - rays} лучиков`
                : '🏆 Максимальный уровень!';

            const emojiEl = document.getElementById('yupikEmoji');
            emojiEl.textContent = '⏳';
            emojiEl.style.display = 'block';
            const img = document.getElementById('yupikImg');
            img.style.display = 'none';
            img.removeAttribute('src'); // сброс перед новым URL

            const url = user.yupikCustomUrl
                ? user.yupikCustomUrl
                : (() => {
                    const prompt = buildViewPrompt(stage, user.totem);
                    const seed = uidToSeedView(user.uid) + stage.threshold;
                    return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=flux&width=512&height=512&nologo=true&seed=${seed}&enhance=true`;
                })();

            img.onload  = () => { img.style.display = 'block'; emojiEl.style.display = 'none'; };
            img.onerror = () => { img.style.display = 'none'; emojiEl.textContent = stage.emoji; emojiEl.style.display = 'block'; };
            img.src = url;
        }
    </script>
    <script src="mobile-nav.js"></script>
<script src="desktop-nav.js"></script>
</body>
</html>
