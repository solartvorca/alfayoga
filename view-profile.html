<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль участника — Лунный Будильник</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-btn {
            display: inline-block;
            color: #a18cd1;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .back-btn:hover {
            color: #ffd700;
        }

        .profile-card {
            background: rgba(180, 100, 255, 0.08);
            border: 1px solid rgba(180, 100, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-nick {
            font-size: 24px;
            font-weight: 600;
            color: #a18cd1;
            margin-bottom: 10px;
        }

        .profile-email {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .rays-display {
            font-size: 48px;
            margin: 20px 0;
        }

        .rays-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .section {
            background: rgba(180, 100, 255, 0.08);
            border: 1px solid rgba(180, 100, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #a18cd1;
            margin-bottom: 15px;
        }

        .section-text {
            font-size: 14px;
            color: #c8d0db;
            line-height: 1.8;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            display: inline-block;
            background: rgba(0, 143, 204, 0.2);
            border: 1px solid rgba(0, 143, 204, 0.5);
            color: #00a3e0;
            padding: 8px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            word-break: break-all;
        }

        .link-item:hover {
            background: rgba(0, 143, 204, 0.3);
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        @media (max-width: 640px) {
            .profile-container {
                max-width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <a class="back-btn" onclick="history.back()">← Назад</a>

        <div class="profile-card">
            <div class="profile-nick" id="profileNick">Загрузка...</div>
            <div class="profile-email" id="profileEmail"></div>
            <div style="display: flex; justify-content: space-around; margin: 20px 0;">
                <div style="text-align: center;">
                    <div class="rays-display">🔥 <span id="raysCount">0</span></div>
                    <div class="rays-label">ЛУЧИКОВ</div>
                </div>
                <div style="text-align: center;">
                    <div class="rays-display">✨ <span id="dustCount">0</span></div>
                    <div class="rays-label">ЗОЛОТОЙ ПЫЛЬЦЫ</div>
                </div>
            </div>
        </div>

        <div id="profileSection"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        async function loadPublicProfile() {
            const params = new URLSearchParams(window.location.search);
            const uid = params.get("uid");

            if (!uid) {
                document.querySelector(".profile-container").innerHTML = '<p style="text-align: center; color: #888;">Профиль не найден</p>';
                return;
            }

            try {
                const userDoc = await db.collection("users").doc(uid).get();
                if (!userDoc.exists) {
                    document.querySelector(".profile-container").innerHTML = '<p style="text-align: center; color: #888;">Пользователь не найден</p>';
                    return;
                }

                const user = userDoc.data();
                document.getElementById("profileNick").textContent = user.nick || "Участник";
                document.getElementById("profileEmail").textContent = user.email || "";
                document.getElementById("raysCount").textContent = user.rays || 0;
                document.getElementById("dustCount").textContent = user.dustAmount || 0;

                const profile = user.creativeProfile || {};

                let profileHTML = '';
                if (profile.bio) {
                    profileHTML += `
                        <div class="section">
                            <div class="section-title">✨ О себе</div>
                            <div class="section-text">${profile.bio}</div>
                        </div>
                    `;
                }

                if (profile.services) {
                    profileHTML += `
                        <div class="section">
                            <div class="section-title">💼 Услуги</div>
                            <div class="section-text">${profile.services}</div>
                        </div>
                    `;
                }

                if (profile.links && profile.links.length > 0) {
                    profileHTML += `
                        <div class="section">
                            <div class="section-title">🔗 Ссылки</div>
                            <div class="links-list">
                                ${profile.links.map(link => `<a href="${link}" target="_blank" class="link-item">${link}</a>`).join('')}
                            </div>
                        </div>
                    `;
                }

                if (!profileHTML) {
                    profileHTML = '<div class="empty-state">Профиль не заполнен</div>';
                }

                document.getElementById("profileSection").innerHTML = profileHTML;
            } catch (error) {
                console.error("Ошибка:", error);
                document.querySelector(".profile-container").innerHTML = '<p style="text-align: center; color: #888;">Ошибка загрузки профиля</p>';
            }
        }

        loadPublicProfile();
    </script>
    <script src="mobile-nav.js"></script>
</body>
</html>
