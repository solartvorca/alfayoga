<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0e27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Радуга Луна">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Услуги & Товары — Лунный Будильник</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .shop-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(180, 100, 255, 0.2);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #a18cd1;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #ffd700;
        }

        .logout-btn {
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.5);
            color: #ff6464;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            background: rgba(255, 100, 100, 0.3);
        }

        .hero-section {
            background: rgba(180, 100, 255, 0.08);
            border: 1px solid rgba(180, 100, 255, 0.2);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(180, 100, 255, 0.1);
            margin: 0 auto 20px;
            overflow: hidden;
            border: 2px solid rgba(180, 100, 255, 0.3);
        }

        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-name {
            font-size: 28px;
            font-weight: 600;
            color: #a18cd1;
            margin-bottom: 15px;
        }

        .hero-description {
            font-size: 14px;
            color: #c8d0db;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 600;
            color: #a18cd1;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: rgba(180, 100, 255, 0.08);
            border: 1px solid rgba(180, 100, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.2s;
        }

        .item-card:hover {
            background: rgba(180, 100, 255, 0.12);
            border-color: rgba(180, 100, 255, 0.4);
        }

        .item-title {
            font-size: 18px;
            font-weight: 600;
            color: #a18cd1;
            margin-bottom: 12px;
        }

        .item-description {
            font-size: 13px;
            color: #c8d0db;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .item-price {
            font-size: 16px;
            font-weight: 600;
            color: #ffd700;
            margin-bottom: 15px;
        }

        .item-link {
            display: inline-block;
            background: linear-gradient(135deg, #a18cd1 0%, #ffd700 100%);
            color: #0a0e27;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .item-link:hover {
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
        }

        .rays-counter {
            background: rgba(0, 208, 132, 0.1);
            border: 1px solid rgba(0, 208, 132, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .rays-counter p {
            color: #00d084;
            font-weight: 600;
            margin: 0;
            font-size: 14px;
        }

        .unlock-notice {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .unlock-notice p {
            color: #ffd700;
            font-weight: 600;
            margin: 0;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .shop-container {
                max-width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="shop-container">
        <!-- Навигация -->
        <div class="nav-bar">
            <div class="nav-links">
                <a href="index.html">🌙 Будильник</a>
                <a href="marathon.html">📖 Марафон</a>
                <a href="courses.html">🎓 Курсы</a>
                <a href="profile.html">👤 Профиль</a>
                <a href="wishes.html">✨ Желания</a>
                <a href="lifestyle.html">🌿 Образ жизни</a>
                <a href="habits.html">📋 Привычки</a>
                <a href="planner.html">📅 Планировщик</a>
                <a href="notifications.html">🔔 Уведомления</a>
            </div>
            <button class="logout-btn" onclick="logout()">Выход</button>
        </div>

        <!-- Счетчик лучиков -->
        <div class="rays-counter" id="raysCounter">
            <p>🔥 Сообщество собрало <span id="totalRays">0</span> лучиков из 100</p>
        </div>

        <!-- Уведомление о разблокировке -->
        <div class="unlock-notice" id="unlockNotice" style="display: none;">
            <p>🎉 Поздравляем! Вы разблокировали услуги и товары!</p>
        </div>

        <!-- Информация об авторе -->
        <div class="hero-section" id="heroSection">
            <div class="hero-photo" id="photoContainer" style="display: none;">
                <img id="authorPhoto" src="" alt="Автор">
            </div>
            <div class="hero-name" id="authorName">Загрузка...</div>
            <div class="hero-description" id="authorDescription"></div>
        </div>

        <!-- Услуги -->
        <div class="section" id="servicesSection" style="display: none;">
            <div class="section-title">🛍️ Услуги</div>
            <div class="items-grid" id="servicesList">
                <div class="empty-state">Нет услуг</div>
            </div>
        </div>

        <!-- Товары -->
        <div class="section" id="productsSection" style="display: none;">
            <div class="section-title">📦 Товары</div>
            <div class="items-grid" id="productsList">
                <div class="empty-state">Нет товаров</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script src="auth.js"></script>
    <script>
        let totalRays = 0;

        async function loadShopContent() {
            try {
                // Загрузить информацию об авторе и его контент
                const doc = await db.collection("settings").doc("author").get();

                if (doc.exists) {
                    const data = doc.data();

                    // Информация об авторе
                    document.getElementById("authorName").textContent = data.name || "Автор";
                    document.getElementById("authorDescription").textContent = data.description || "";

                    if (data.photo) {
                        document.getElementById("photoContainer").style.display = "block";
                        document.getElementById("authorPhoto").src = data.photo;
                    }

                    // Услуги
                    if (data.services && data.services.length > 0) {
                        document.getElementById("servicesSection").style.display = "block";
                        document.getElementById("servicesList").innerHTML = data.services.map(s => `
                            <div class="item-card">
                                <div class="item-title">${s.name}</div>
                                <div class="item-description">${s.description}</div>
                                <a href="${s.link}" target="_blank" class="item-link">Подробнее →</a>
                            </div>
                        `).join("");
                    }

                    // Товары
                    if (data.products && data.products.length > 0) {
                        document.getElementById("productsSection").style.display = "block";
                        document.getElementById("productsList").innerHTML = data.products.map(p => `
                            <div class="item-card">
                                <div class="item-title">${p.name}</div>
                                <div class="item-description">${p.description}</div>
                                <div class="item-price">${p.price}</div>
                                <a href="${p.link}" target="_blank" class="item-link">Купить →</a>
                            </div>
                        `).join("");
                    }
                }

                // Подсчет всех лучиков
                calculateTotalRays();
            } catch (error) {
                console.error("Ошибка при загрузке контента магазина:", error);
            }
        }

        async function calculateTotalRays() {
            try {
                const snapshot = await db.collection("users").get();
                totalRays = 0;

                snapshot.docs.forEach(doc => {
                    totalRays += doc.data().rays || 0;
                });

                document.getElementById("totalRays").textContent = totalRays;

                if (totalRays >= 100) {
                    document.getElementById("unlockNotice").style.display = "block";
                }

                // Обновлять в реальном времени
                setTimeout(calculateTotalRays, 30000);
            } catch (error) {
                console.error("Ошибка при подсчете лучиков:", error);
            }
        }

        // Загрузка при входе
        auth.onAuthStateChanged(user => {
            if (user) {
                loadShopContent();
            } else {
                window.location.href = "login.html";
            }
        });
    </script>
    <script src="mobile-nav.js"></script>
</body>
</html>
