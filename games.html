<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0e27">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Игры">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Игры — Радуга Луна</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-header {
            text-align: center;
            padding: 32px 20px 8px;
        }
        .page-header h1 { font-size: 26px; font-weight: 700; color: #a18cd1; margin: 0 0 6px; }
        .page-header p { font-size: 13px; color: #888; margin: 0; }

        .balance-hint {
            text-align: center;
            padding: 8px 20px 16px;
            font-size: 13px;
            color: #888;
        }
        .balance-hint .rays-val {
            color: #ffd700;
            font-weight: 700;
            font-size: 15px;
        }

        .games-container { max-width: 800px; margin: 0 auto; padding: 0 16px 100px; }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 4px;
        }

        .game-card {
            background: rgba(161,140,209,0.08);
            border: 1px solid rgba(161,140,209,0.2);
            border-radius: 16px;
            padding: 20px 14px 16px;
            cursor: pointer;
            transition: transform 0.18s, border-color 0.18s, background 0.18s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            position: relative;
        }
        .game-card.locked {
            opacity: 0.75;
            cursor: default;
        }
        .game-card:not(.locked):hover, .game-card:not(.locked):active {
            transform: translateY(-3px);
            border-color: rgba(161,140,209,0.5);
            background: rgba(161,140,209,0.14);
        }

        .game-icon { font-size: 42px; line-height: 1; }
        .game-name { font-size: 13px; font-weight: 600; color: #e0e6ed; line-height: 1.3; }
        .game-desc { font-size: 11px; color: #888; line-height: 1.4; }

        .game-open-btn {
            margin-top: 4px;
            background: rgba(161,140,209,0.2);
            border: 1px solid rgba(161,140,209,0.4);
            border-radius: 8px;
            color: #a18cd1;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 12px;
            cursor: pointer;
            transition: background 0.15s;
            width: 100%;
        }
        .game-open-btn:hover { background: rgba(161,140,209,0.35); }

        .game-unlock-btn {
            margin-top: 4px;
            background: rgba(255,215,0,0.12);
            border: 1px solid rgba(255,215,0,0.35);
            border-radius: 8px;
            color: #ffd700;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 8px;
            cursor: pointer;
            transition: background 0.15s;
            width: 100%;
            line-height: 1.3;
        }
        .game-unlock-btn:hover { background: rgba(255,215,0,0.22); }
        .game-unlock-btn.cant-afford {
            opacity: 0.45;
            cursor: not-allowed;
            border-color: rgba(255,100,100,0.3);
            color: #ff8888;
            background: rgba(255,100,100,0.08);
        }

        .lock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            opacity: 0.7;
        }

        .price-tag {
            font-size: 10px;
            color: #ffd700;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
            font-size: 14px;
        }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

        /* Модал подтверждения покупки */
        .unlock-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .unlock-modal.open { display: flex; }
        .unlock-modal-box {
            background: #12102a;
            border: 1px solid rgba(255,215,0,0.35);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }
        .unlock-modal-icon { font-size: 52px; margin-bottom: 12px; }
        .unlock-modal-title { font-size: 18px; font-weight: 700; color: #ffd700; margin-bottom: 8px; }
        .unlock-modal-desc { font-size: 13px; color: #c8d0db; line-height: 1.6; margin-bottom: 20px; }
        .unlock-modal-price {
            font-size: 22px; font-weight: 800; color: #ffd700; margin-bottom: 6px;
        }
        .unlock-modal-balance { font-size: 12px; color: #888; margin-bottom: 24px; }
        .unlock-modal-btns { display: flex; gap: 10px; }
        .unlock-modal-btns button {
            flex: 1; padding: 12px; border-radius: 10px; font-size: 14px;
            font-weight: 600; cursor: pointer; border: none;
        }
        .btn-confirm-unlock {
            background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(200,160,0,0.2));
            border: 1px solid rgba(255,215,0,0.5) !important;
            color: #ffd700;
        }
        .btn-confirm-unlock:hover { background: rgba(255,215,0,0.35) !important; }
        .btn-cancel-unlock {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15) !important;
            color: #888;
        }

        /* Оверлей просмотра игры */
        .game-viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: #0a0e27;
            flex-direction: column;
        }
        .game-viewer.open { display: flex; }
        .game-viewer-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(161,140,209,0.2);
            flex-shrink: 0;
        }
        .game-viewer-title {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            color: #e0e6ed;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-viewer-close {
            background: rgba(255,100,100,0.18);
            border: 1px solid rgba(255,100,100,0.4);
            border-radius: 8px;
            color: #ff6464;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .game-viewer-external {
            background: rgba(161,140,209,0.15);
            border: 1px solid rgba(161,140,209,0.35);
            border-radius: 8px;
            color: #a18cd1;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
        }
        .game-iframe-wrap { flex: 1; position: relative; }
        .game-iframe-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
        .game-iframe-blocked {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(10,14,39,0.97);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            text-align: center;
        }
        .game-iframe-blocked.show { display: flex; }
        .game-iframe-blocked p { color: #888; font-size: 14px; line-height: 1.6; }
        .game-open-external-btn {
            background: rgba(161,140,209,0.2);
            border: 1px solid rgba(161,140,209,0.5);
            border-radius: 12px;
            color: #a18cd1;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 28px;
            cursor: pointer;
            text-decoration: none;
        }

        @media (min-width: 600px) {
            .games-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }
    </style>
</head>
<body>

<div class="page-header">
    <h1>🎮 Игры</h1>
    <p>Приложения и игры от практиков</p>
</div>
<div class="balance-hint">
    Твой баланс: <span class="rays-val" id="userRaysDisplay">...</span> лучиков ✨
</div>

<div class="games-container">
    <div class="games-grid" id="gamesGrid">
        <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-icon">⏳</div>
            <div>Загрузка...</div>
        </div>
    </div>
</div>

<!-- Модал подтверждения покупки -->
<div class="unlock-modal" id="unlockModal">
    <div class="unlock-modal-box">
        <div class="unlock-modal-icon" id="modalIcon">🎮</div>
        <div class="unlock-modal-title" id="modalTitle">Открыть игру</div>
        <div class="unlock-modal-desc" id="modalDesc">Для доступа к этой игре нужно потратить лучики.</div>
        <div class="unlock-modal-price" id="modalPrice">100 000 ✨</div>
        <div class="unlock-modal-balance" id="modalBalance"></div>
        <div class="unlock-modal-btns">
            <button class="btn-confirm-unlock" id="modalConfirmBtn" onclick="confirmUnlock()">🔓 Открыть</button>
            <button class="btn-cancel-unlock" onclick="closeUnlockModal()">Отмена</button>
        </div>
    </div>
</div>

<!-- Оверлей игры -->
<div class="game-viewer" id="gameViewer">
    <div class="game-viewer-header">
        <span class="game-viewer-title" id="viewerTitle">Игра</span>
        <a id="viewerExternal" href="#" target="_blank" class="game-viewer-external">🔗 Открыть</a>
        <button class="game-viewer-close" onclick="closeGame()">✕ Выйти</button>
    </div>
    <div class="game-iframe-wrap">
        <iframe id="gameFrame" src="about:blank" allow="fullscreen; autoplay"></iframe>
        <div class="game-iframe-blocked" id="iframeBlocked">
            <div style="font-size:40px;">🚫</div>
            <p>Эта страница не поддерживает встроенный просмотр.<br>Откройте игру в новой вкладке.</p>
            <a id="blockedLink" href="#" target="_blank" class="game-open-external-btn">🎮 Открыть игру</a>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="mobile-nav.js"></script>
<script src="desktop-nav.js"></script>
<script>
    let _games = [];
    let _pendingUnlockId = null;
    const _isAdmin = () => window.currentUser && (window.currentUser.isAdmin || window.currentUser.email === 'wuallar@gmail.com');

    function _userRays() { return window.currentUser?.rays || 0; }
    function _unlockedGames() { return window.currentUser?.unlockedGames || []; }
    function _isUnlocked(g) {
        if (_isAdmin()) return true;
        if (!g.price || g.price === 0) return true;
        return _unlockedGames().includes(g.id);
    }

    function fmtNum(n) { return n ? n.toLocaleString('ru-RU') : '0'; }

    async function loadGames() {
        try {
            const snap = await db.collection('games')
                .where('isActive', '==', true)
                .orderBy('order')
                .get();
            _games = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch(e) {
            try {
                const snap = await db.collection('games').where('isActive', '==', true).get();
                _games = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (a.order || 99) - (b.order || 99));
            } catch(e2) { console.error('[games] Load error:', e2); }
        }
        renderGames();
    }

    function renderGames() {
        document.getElementById('userRaysDisplay').textContent = fmtNum(_userRays());

        const grid = document.getElementById('gamesGrid');
        if (_games.length === 0) {
            grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
                <div class="empty-icon">🎮</div>
                <div>Игры пока не добавлены</div>
            </div>`;
            return;
        }

        grid.innerHTML = _games.map(g => {
            const unlocked = _isUnlocked(g);
            const canAfford = _userRays() >= (g.price || 0);

            if (unlocked) {
                return `<div class="game-card" onclick="openGame('${g.id}')">
                    <div class="game-icon">${g.icon || '🎮'}</div>
                    <div class="game-name">${g.title}</div>
                    ${g.description ? `<div class="game-desc">${g.description}</div>` : ''}
                    <button class="game-open-btn" onclick="event.stopPropagation();openGame('${g.id}')">Играть</button>
                </div>`;
            } else {
                return `<div class="game-card locked">
                    <div class="lock-badge">🔒</div>
                    <div class="game-icon" style="filter:grayscale(0.5);">${g.icon || '🎮'}</div>
                    <div class="game-name">${g.title}</div>
                    ${g.description ? `<div class="game-desc">${g.description}</div>` : ''}
                    <div class="price-tag">✨ ${fmtNum(g.price)} лучиков</div>
                    <button class="game-unlock-btn ${canAfford ? '' : 'cant-afford'}"
                        onclick="requestUnlock('${g.id}')">
                        ${canAfford ? '🔓 Открыть доступ' : '✨ Недостаточно лучиков'}
                    </button>
                </div>`;
            }
        }).join('');
    }

    function requestUnlock(id) {
        const g = _games.find(x => x.id === id);
        if (!g) return;
        const rays = _userRays();
        const canAfford = rays >= (g.price || 0);

        _pendingUnlockId = id;
        document.getElementById('modalIcon').textContent = g.icon || '🎮';
        document.getElementById('modalTitle').textContent = g.title;
        document.getElementById('modalDesc').textContent = g.description || 'Открыть постоянный доступ к этой игре.';
        document.getElementById('modalPrice').textContent = `${fmtNum(g.price)} ✨ лучиков`;
        document.getElementById('modalBalance').textContent = `Твой баланс: ${fmtNum(rays)} лучиков`;

        const btn = document.getElementById('modalConfirmBtn');
        if (canAfford) {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.textContent = '🔓 Открыть';
        } else {
            btn.disabled = true;
            btn.style.opacity = '0.4';
            btn.textContent = '✨ Недостаточно лучиков';
        }

        document.getElementById('unlockModal').classList.add('open');
    }

    function closeUnlockModal() {
        document.getElementById('unlockModal').classList.remove('open');
        _pendingUnlockId = null;
    }

    async function confirmUnlock() {
        const id = _pendingUnlockId;
        if (!id) return;
        const g = _games.find(x => x.id === id);
        if (!g) return;

        const btn = document.getElementById('modalConfirmBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Открываю...';

        try {
            const uid = window.currentUser.uid;
            const newRays = _userRays() - (g.price || 0);
            const newUnlocked = [..._unlockedGames(), id];

            await db.collection('users').doc(uid).update({
                rays: newRays,
                unlockedGames: newUnlocked
            });

            window.currentUser.rays = newRays;
            window.currentUser.unlockedGames = newUnlocked;

            closeUnlockModal();
            renderGames();
            openGame(id);
        } catch(e) {
            btn.disabled = false;
            btn.textContent = '🔓 Открыть';
            alert('Ошибка: ' + e.message);
        }
    }

    function openGame(id) {
        const g = _games.find(x => x.id === id);
        if (!g || !g.url) return;
        if (!_isUnlocked(g)) { requestUnlock(id); return; }

        document.getElementById('viewerTitle').textContent = (g.icon || '🎮') + ' ' + g.title;
        document.getElementById('viewerExternal').href = g.url;
        document.getElementById('blockedLink').href = g.url;
        document.getElementById('iframeBlocked').classList.remove('show');

        const frame = document.getElementById('gameFrame');
        frame.src = g.url;
        frame.onerror = () => document.getElementById('iframeBlocked').classList.add('show');

        document.getElementById('gameViewer').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeGame() {
        document.getElementById('gameFrame').src = 'about:blank';
        document.getElementById('gameViewer').classList.remove('open');
        document.body.style.overflow = '';
    }

    window.addEventListener('popstate', closeGame);

    auth.onAuthStateChanged(user => {
        if (!user) { window.location.href = 'login.html'; return; }
        // currentUser уже заполнен auth.js — даём ему время, потом грузим
        const waitForUser = (tries) => {
            if (window.currentUser) { loadGames(); return; }
            if (tries > 0) setTimeout(() => waitForUser(tries - 1), 150);
        };
        waitForUser(10);
    });
</script>
</body>
</html>
